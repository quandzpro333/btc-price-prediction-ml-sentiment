<svg viewBox="0 0 1240 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#ffffff"/>

  <text x="620" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">
    Kien truc he thong — BTC Price Predictor
  </text>
  <text x="620" y="58" text-anchor="middle" font-size="12" fill="#6b7280">
    Do an hoc tap — Machine Learning &amp; Market Sentiment (khong phai loi khuyen dau tu)
  </text>

  <!-- ===== ROW 1: External data sources ===== -->
  <text x="60" y="100" font-size="12" font-weight="bold" fill="#9ca3af">NGUON DU LIEU NGOAI</text>

  <rect x="40" y="112" width="240" height="86" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Binance API</text>
  <text x="160" y="160" text-anchor="middle" font-size="11" fill="#92400e">REST: OHLCV (gia, volume)</text>
  <text x="160" y="176" text-anchor="middle" font-size="11" fill="#92400e">WebSocket: gia realtime</text>

  <rect x="320" y="112" width="240" height="86" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">Fear &amp; Greed API</text>
  <text x="440" y="160" text-anchor="middle" font-size="11" fill="#065f46">alternative.me (mien phi)</text>
  <text x="440" y="176" text-anchor="middle" font-size="11" fill="#065f46">Chi so tam ly thi truong</text>

  <rect x="600" y="112" width="240" height="86" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="720" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Gemini API</text>
  <text x="720" y="160" text-anchor="middle" font-size="11" fill="#1e3a8a">Tom tat tin tuc, sentiment,</text>
  <text x="720" y="176" text-anchor="middle" font-size="11" fill="#1e3a8a">AI Analysis, Chatbot</text>

  <rect x="880" y="112" width="300" height="86" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1030" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Gold / DXY / Twitter / News API</text>
  <text x="1030" y="160" text-anchor="middle" font-size="11" fill="#991b1b">(Placeholder — chua tich hop thuc te)</text>
  <text x="1030" y="176" text-anchor="middle" font-size="11" fill="#991b1b">Huong phat trien tiep theo</text>

  <!-- ===== ROW 2: Backend ===== -->
  <text x="60" y="250" font-size="12" font-weight="bold" fill="#9ca3af">BACKEND (FastAPI + Python)</text>

  <rect x="40" y="262" width="560" height="160" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="320" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">FastAPI Backend</text>

  <rect x="60" y="304" width="150" height="46" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="135" y="323" text-anchor="middle" font-size="10.5" fill="#4c1d95">Routers</text>
  <text x="135" y="337" text-anchor="middle" font-size="9.5" fill="#6d28d9">price / prediction / news</text>

  <rect x="222" y="304" width="150" height="46" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="297" y="323" text-anchor="middle" font-size="10.5" fill="#4c1d95">Services</text>
  <text x="297" y="337" text-anchor="middle" font-size="9.5" fill="#6d28d9">binance / indicator / gemini</text>

  <rect x="384" y="304" width="180" height="46" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="474" y="323" text-anchor="middle" font-size="10.5" fill="#4c1d95">Indicator Engine</text>
  <text x="474" y="337" text-anchor="middle" font-size="9.5" fill="#6d28d9">EMA / RSI / Bollinger Bands</text>

  <rect x="60" y="364" width="514" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="317" y="390" text-anchor="middle" font-size="10.5" fill="#4c1d95">SQLite Database — users / predictions / news / sentiment / chat_history</text>

  <!-- ML box -->
  <rect x="640" y="262" width="260" height="160" rx="10" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
  <text x="770" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#86198f">ML Module (ml/)</text>
  <text x="770" y="316" text-anchor="middle" font-size="11" fill="#701a75">Linear Regression</text>
  <text x="770" y="332" text-anchor="middle" font-size="10" fill="#701a75">(hoac Simple RNN)</text>
  <rect x="662" y="346" width="216" height="34" rx="6" fill="#ffffff" stroke="#c026d3" stroke-width="1.2"/>
  <text x="770" y="367" text-anchor="middle" font-size="10" fill="#701a75">Train offline -&gt; luu .joblib</text>
  <rect x="662" y="386" width="216" height="26" rx="6" fill="#ffffff" stroke="#c026d3" stroke-width="1.2"/>
  <text x="770" y="403" text-anchor="middle" font-size="9.5" fill="#701a75">Backend load model de predict()</text>

  <!-- WebSocket bypass note -->
  <rect x="920" y="262" width="260" height="160" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="1050" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">Ghi chu quan trong</text>
  <text x="1050" y="318" text-anchor="middle" font-size="10" fill="#475569">Binance WebSocket duoc</text>
  <text x="1050" y="334" text-anchor="middle" font-size="10" fill="#475569">frontend goi TRUC TIEP,</text>
  <text x="1050" y="350" text-anchor="middle" font-size="10" fill="#475569">khong qua backend —</text>
  <text x="1050" y="366" text-anchor="middle" font-size="10" fill="#475569">giam tai va do tre cho</text>
  <text x="1050" y="382" text-anchor="middle" font-size="10" fill="#475569">bieu do gia realtime.</text>

  <!-- ===== ROW 3: Frontend ===== -->
  <text x="60" y="470" font-size="12" font-weight="bold" fill="#9ca3af">FRONTEND (Next.js + TypeScript + Tailwind)</text>

  <rect x="40" y="482" width="1140" height="130" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="610" y="508" text-anchor="middle" font-size="15" font-weight="bold" fill="#134e4a">Next.js Web App (localhost:3000)</text>

  <rect x="64" y="524" width="168" height="70" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/>
  <text x="148" y="546" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#134e4a">Price Chart</text>
  <text x="148" y="562" text-anchor="middle" font-size="9" fill="#0f766e">Candlestick + EMA</text>
  <text x="148" y="576" text-anchor="middle" font-size="9" fill="#0f766e">+ Live WebSocket</text>

  <rect x="248" y="524" width="168" height="70" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/>
  <text x="332" y="546" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#134e4a">Prediction Card</text>
  <text x="332" y="562" text-anchor="middle" font-size="9" fill="#0f766e">Gia du doan, Trend,</text>
  <text x="332" y="576" text-anchor="middle" font-size="9" fill="#0f766e">Do tin cay</text>

  <rect x="432" y="524" width="168" height="70" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/>
  <text x="516" y="546" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#134e4a">Backtest Chart</text>
  <text x="516" y="562" text-anchor="middle" font-size="9" fill="#0f766e">Du doan vs Thuc te</text>
  <text x="516" y="576" text-anchor="middle" font-size="9" fill="#0f766e">tren tap test</text>

  <rect x="616" y="524" width="168" height="70" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/>
  <text x="700" y="546" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#134e4a">Model Explainability</text>
  <text x="700" y="562" text-anchor="middle" font-size="9" fill="#0f766e">He so Linear Regression,</text>
  <text x="700" y="576" text-anchor="middle" font-size="9" fill="#0f766e">MAE / MAPE</text>

  <rect x="800" y="524" width="168" height="70" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/>
  <text x="884" y="546" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#134e4a">AI Analysis</text>
  <text x="884" y="562" text-anchor="middle" font-size="9" fill="#0f766e">Bao cao Gemini:</text>
  <text x="884" y="576" text-anchor="middle" font-size="9" fill="#0f766e">xu huong, tin tuc, sentiment</text>

  <rect x="984" y="524" width="176" height="70" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/>
  <text x="1072" y="546" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#134e4a">News + AI Chat</text>
  <text x="1072" y="562" text-anchor="middle" font-size="9" fill="#0f766e">Fear&amp;Greed gauge,</text>
  <text x="1072" y="576" text-anchor="middle" font-size="9" fill="#0f766e">chatbot hoi dap</text>

  <!-- ===== Arrows ===== -->
  <!-- data sources down to backend -->
  <line x1="160" y1="198" x2="160" y2="260" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="198" x2="440" y2="260" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="198" x2="720" y2="260" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1030" y1="198" x2="1030" y2="260" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- backend <-> ml -->
  <line x1="600" y1="342" x2="638" y2="342" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- backend down to frontend -->
  <line x1="320" y1="422" x2="320" y2="480" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="452" font-size="9.5" fill="#6b7280">REST API (/api/*)</text>

  <!-- Binance WS direct to frontend (bypass backend) -->
  <path d="M 160 198 C 160 340, 148 460, 148 522" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arrowBlue)"/>
  <text x="20" y="360" font-size="9.5" fill="#2563eb" transform="rotate(-90, 20, 360)">WebSocket truc tiep (gia realtime)</text>

  <!-- Legend -->
  <line x1="60" y1="700" x2="100" y2="700" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="108" y="704" font-size="10" fill="#374151">Goi qua REST API (backend)</text>
  <line x1="330" y1="700" x2="370" y2="700" stroke="#2563eb" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arrowBlue)"/>
  <text x="378" y="704" font-size="10" fill="#374151">Goi truc tiep tu browser (WebSocket)</text>
  <rect x="700" y="692" width="16" height="16" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="722" y="704" font-size="10" fill="#374151">Chua tich hop (placeholder)</text>

  <text x="620" y="740" text-anchor="middle" font-size="10" fill="#9ca3af">
    Data flow: Binance/Gemini/Fear&amp;Greed -&gt; FastAPI Backend -&gt; SQLite + ML Model -&gt; Next.js Frontend
  </text>
</svg>
